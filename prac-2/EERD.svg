<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="1131" viewBox="0 0 1600 1131">
  <title>EERD - Aegis Digital Forensics 5G Incident Response Platform</title>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 14px; fill: #444; }
    .entity-name { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .attr { font-size: 12.5px; fill: #1a1a2e; font-family: "Consolas", "Courier New", monospace; }
    .attr-pk { font-weight: 700; }
    .note-title { font-size: 12px; font-weight: 700; fill: #7a5b00; }
    .note-text { font-size: 11.5px; fill: #4a3900; font-family: "Consolas", "Courier New", monospace; }
    .rel-label { font-size: 11.5px; fill: #333; font-style: italic; }
    .legend-text { font-size: 11.5px; fill: #1a1a2e; }
    .legend-title { font-size: 12.5px; font-weight: 700; fill: #1a1a2e; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1131" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="42" class="title">EERD &#8211; Aegis Digital Forensics: 5G Incident Response Platform</text>
  <text x="40" y="64" class="subtitle">COS326 Database Systems &#8211; Practical 2 (2026)</text>
  <text x="1560" y="42" text-anchor="end" class="subtitle" font-weight="700">Jaitin Moodally</text>
  <text x="1560" y="60" text-anchor="end" class="subtitle">u23621372</text>
  <line x1="40" y1="76" x2="1560" y2="76" stroke="#cccccc" stroke-width="1"/>

  <!-- ============= Incident (base table) ============= -->
  <g>
    <rect x="620" y="100" width="300" height="176" rx="6" fill="#2f4b7c" stroke="#1a1a2e" stroke-width="1.5"/>
    <rect x="620" y="100" width="300" height="30" rx="6" fill="#2f4b7c"/>
    <rect x="620" y="118" width="300" height="12" fill="#2f4b7c"/>
    <text x="770" y="120" text-anchor="middle" class="entity-name">Incident (base table)</text>
    <line x1="620" y1="130" x2="920" y2="130" stroke="#ffffff" stroke-width="1"/>
    <text x="634" y="150" class="attr attr-pk">incident_id : INTEGER (PK)</text>
    <text x="634" y="168" class="attr">incident_code : VARCHAR(10) UNIQUE</text>
    <text x="634" y="186" class="attr">target_ip : NodeIPType</text>
    <text x="634" y="204" class="attr">severity : SeverityType</text>
    <text x="634" y="222" class="attr">detected_at : TIMESTAMP</text>
    <text x="634" y="246" class="attr" fill="#dce6f5" font-style="italic">generated by SEQUENCE incident_seq</text>
    <text x="634" y="262" class="attr" fill="#dce6f5" font-style="italic">INHERITS shared by both subtypes below</text>
  </g>

  <!-- Generalization triangle (ISA) -->
  <polygon points="770,276 745,320 795,320" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="770" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">ISA</text>
  <line x1="745" y1="320" x2="330" y2="360" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="795" y1="320" x2="1210" y2="360" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- ============= NetworkIncident ============= -->
  <g>
    <rect x="120" y="360" width="420" height="220" rx="6" fill="#3f7d5c" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="330" y="388" text-anchor="middle" class="entity-name">NetworkIncident</text>
    <text x="330" y="405" text-anchor="middle" class="attr" fill="#e4f3ea" font-style="italic">(INHERITS Incident)</text>
    <line x1="120" y1="414" x2="540" y2="414" stroke="#ffffff" stroke-width="1"/>
    <text x="134" y="434" class="attr attr-pk">incident_id : INTEGER (PK, inherited)</text>
    <text x="134" y="452" class="attr">incident_code, target_ip, severity,</text>
    <text x="134" y="468" class="attr">detected_at &#8212; inherited from Incident</text>
    <line x1="120" y1="480" x2="540" y2="480" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2,3"/>
    <text x="134" y="500" class="attr">slice_id : VARCHAR(20)</text>
    <text x="134" y="518" class="attr">evidence_hashes : TEXT[] (array)</text>
    <text x="134" y="540" class="attr" fill="#e4f3ea" font-style="italic">BEFORE INSERT/UPDATE &#8594;</text>
    <text x="134" y="556" class="attr" fill="#e4f3ea" font-style="italic">trg_check_evidence_integrity()</text>
    <text x="134" y="572" class="attr" fill="#e4f3ea" font-style="italic">AFTER DELETE &#8594; trg_audit_deleted_network_incident()</text>
  </g>

  <!-- ============= NodeBreachIncident ============= -->
  <g>
    <rect x="1000" y="360" width="440" height="220" rx="6" fill="#8a3f5c" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="1220" y="388" text-anchor="middle" class="entity-name">NodeBreachIncident</text>
    <text x="1220" y="405" text-anchor="middle" class="attr" fill="#f5e2ea" font-style="italic">(INHERITS Incident)</text>
    <line x1="1000" y1="414" x2="1440" y2="414" stroke="#ffffff" stroke-width="1"/>
    <text x="1014" y="434" class="attr attr-pk">incident_id : INTEGER (PK, inherited)</text>
    <text x="1014" y="452" class="attr">incident_code, target_ip, severity,</text>
    <text x="1014" y="468" class="attr">detected_at &#8212; inherited from Incident</text>
    <line x1="1000" y1="480" x2="1440" y2="480" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2,3"/>
    <text x="1014" y="500" class="attr">node_id : VARCHAR(20)</text>
    <text x="1014" y="518" class="attr">assigned_investigator : InvestigatorName (UDT)</text>
    <text x="1014" y="536" class="attr">is_contained : BOOLEAN</text>
    <text x="1014" y="558" class="attr" fill="#f5e2ea" font-style="italic">AFTER DELETE &#8594;</text>
    <text x="1014" y="574" class="attr" fill="#f5e2ea" font-style="italic">trg_audit_deleted_node_breach_incident()</text>
  </g>

  <!-- ============= Domain / Enum / UDT notes ============= -->
  <g>
    <rect x="960" y="90" width="230" height="52" rx="4" fill="#fff6d8" stroke="#c9a400" stroke-width="1"/>
    <text x="972" y="107" class="note-title">DOMAIN NodeIPType</text>
    <text x="972" y="123" class="note-text">VARCHAR(15) CHECK IPv4 format</text>
    <line x1="960" y1="116" x2="920" y2="182" stroke="#c9a400" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <g>
    <rect x="960" y="150" width="230" height="52" rx="4" fill="#fff6d8" stroke="#c9a400" stroke-width="1"/>
    <text x="972" y="167" class="note-title">ENUM SeverityType</text>
    <text x="972" y="183" class="note-text">LOW | MEDIUM | HIGH | CRITICAL</text>
    <line x1="960" y1="176" x2="920" y2="200" stroke="#c9a400" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <g>
    <rect x="1100" y="210" width="260" height="66" rx="4" fill="#fff6d8" stroke="#c9a400" stroke-width="1"/>
    <text x="1112" y="227" class="note-title">UDT InvestigatorName (composite ROW)</text>
    <text x="1112" y="243" class="note-text">title VARCHAR(10)</text>
    <text x="1112" y="257" class="note-text">first_name, last_name VARCHAR(50)</text>
    <line x1="1130" y1="276" x2="1160" y2="500" stroke="#c9a400" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- ============= EvidenceCatalog ============= -->
  <g>
    <rect x="40" y="660" width="300" height="140" rx="6" fill="#6b5b95" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="190" y="688" text-anchor="middle" class="entity-name">EvidenceCatalog</text>
    <line x1="40" y1="700" x2="340" y2="700" stroke="#ffffff" stroke-width="1"/>
    <text x="54" y="722" class="attr attr-pk">hash_id : INTEGER (PK)</text>
    <text x="54" y="740" class="attr">evidence_hash : TEXT UNIQUE</text>
    <text x="54" y="758" class="attr">file_type : VARCHAR(20)</text>
    <text x="54" y="782" class="attr" fill="#e9e4f5" font-style="italic">generated by SEQUENCE evidence_seq</text>
  </g>

  <!-- Relationship: EvidenceCatalog validates NetworkIncident.evidence_hashes -->
  <line x1="200" y1="660" x2="200" y2="580" stroke="#1a1a2e" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="210" y="600" class="rel-label">validates each element</text>
  <text x="210" y="616" class="rel-label">of evidence_hashes[] via</text>
  <text x="210" y="632" class="rel-label">is_hash_registered() /</text>
  <text x="210" y="648" class="rel-label">validate_evidence_array()</text>

  <!-- ============= DeletedIncidentAudit ============= -->
  <g>
    <rect x="440" y="660" width="620" height="230" rx="6" fill="#b06a1e" stroke="#1a1a2e" stroke-width="1.5"/>
    <text x="750" y="688" text-anchor="middle" class="entity-name">DeletedIncidentAudit (immutable audit log)</text>
    <line x1="440" y1="700" x2="1060" y2="700" stroke="#ffffff" stroke-width="1"/>
    <text x="454" y="722" class="attr attr-pk">audit_id : SERIAL (PK)</text>
    <text x="454" y="740" class="attr">incident_id, incident_code, target_ip,</text>
    <text x="454" y="756" class="attr">severity, detected_at &#8212; copied from source row</text>
    <text x="454" y="778" class="attr">incident_type : VARCHAR(20) &#123;NETWORK | NODE_BREACH&#125;</text>
    <text x="454" y="798" class="attr">slice_id, evidence_hashes &#8212; NULL unless NETWORK</text>
    <text x="454" y="816" class="attr">node_id, assigned_investigator, is_contained &#8212; NULL unless NODE_BREACH</text>
    <text x="454" y="838" class="attr">deleted_at : TIMESTAMP (DEFAULT CURRENT_TIMESTAMP)</text>
    <text x="454" y="856" class="attr">deleted_by : VARCHAR(50) &#8592; CURRENT_USER</text>
    <text x="454" y="878" class="attr" fill="#fbe8d2" font-style="italic">populated only by AFTER DELETE triggers &#8212; never written to directly</text>
  </g>

  <!-- Relationships: subtype deletes -> audit -->
  <line x1="470" y1="580" x2="530" y2="660" stroke="#1a1a2e" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="480" y="622" class="rel-label">AFTER DELETE</text>

  <line x1="1220" y1="580" x2="900" y2="660" stroke="#1a1a2e" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1000" y="608" class="rel-label">AFTER DELETE</text>

  <!-- ============= Legend ============= -->
  <g>
    <rect x="1100" y="660" width="460" height="230" rx="6" fill="#f4f4f8" stroke="#999999" stroke-width="1"/>
    <text x="1116" y="684" class="legend-title">Legend</text>

    <rect x="1116" y="696" width="18" height="14" fill="#2f4b7c"/>
    <text x="1142" y="708" class="legend-text">Base table (Incident)</text>

    <rect x="1116" y="718" width="18" height="14" fill="#3f7d5c"/>
    <text x="1142" y="730" class="legend-text">Subtype table &#8212; INHERITS (Incident)</text>

    <rect x="1116" y="740" width="18" height="14" fill="#6b5b95"/>
    <text x="1142" y="752" class="legend-text">Lookup table (EvidenceCatalog)</text>

    <rect x="1116" y="762" width="18" height="14" fill="#b06a1e"/>
    <text x="1142" y="774" class="legend-text">Audit table (DeletedIncidentAudit)</text>

    <rect x="1116" y="784" width="18" height="14" fill="#fff6d8" stroke="#c9a400"/>
    <text x="1142" y="796" class="legend-text">Domain / ENUM / composite UDT annotation</text>

    <polygon points="1125,808 1116,822 1134,822" fill="#ffffff" stroke="#1a1a2e" stroke-width="1"/>
    <text x="1142" y="818" class="legend-text">ISA specialization/generalization triangle</text>

    <line x1="1116" y1="838" x2="1134" y2="838" stroke="#1a1a2e" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="1142" y="842" class="legend-text">Cross-table functional relationship</text>

    <text x="1116" y="868" class="legend-text" font-weight="700">PK</text>
    <text x="1142" y="868" class="legend-text">bold attribute = primary key</text>
  </g>

  <text x="40" y="920" class="subtitle">Sequences: incident_seq drives Incident.incident_id (shared by NetworkIncident &amp; NodeBreachIncident); evidence_seq drives EvidenceCatalog.hash_id.</text>
  <text x="40" y="940" class="subtitle">Table inheritance: NetworkIncident and NodeBreachIncident are created with INHERITS (Incident) &#8212; PostgreSQL ORDBMS table inheritance, not a foreign-key relationship.</text>
</svg>
